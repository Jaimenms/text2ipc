[project]
name = "text2ipc"
version = "0.1.0"
description = "Map free text such as patent abstracts to IPC symbols with embeddings and hierarchical heuristics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
authors = [{ name = "Jaime Neiva Miranda de Souza" }]
keywords = ["patent", "ipc", "classification", "embeddings", "wipo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pyarrow>=17.0",
    "huggingface_hub>=0.25",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
st = ["sentence-transformers>=3.0"]
notebooks = ["jupyterlab>=4.2", "ipykernel>=6.29", "pandas>=2.2", "nbconvert>=7.16"]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
t2ipc = "text2ipc.cli:app"

[project.urls]
Homepage = "https://github.com/Jaimenms/text2ipc"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/text2ipc"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501", "F821"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
